name: Source validation

on:
  push:
    branches:
      - main
      - develop
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies without package install scripts
        run: npm ci --ignore-scripts
      - name: Validate platform source
        run: npm run validate:platform
      - name: Rebuild the deterministic web tree
        run: npm run build:web
      - name: Verify generated web files are committed
        run: git diff --exit-code -- www
      - name: Run deterministic QA gate
        run: npm run qa
